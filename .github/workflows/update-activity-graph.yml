name: Update Contribution Graph

on:
  schedule:
    # Runs once a day at 00:00 UTC.
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate contribution graph SVG
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-activity-graph.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- assets/activity-graph.svg || [ -n "$(git ls-files --others -- assets/activity-graph.svg)" ]; then
            git add assets/activity-graph.svg
            git commit -m "chore: update contribution graph"
            git pull --rebase
            git push
          else
            echo "No changes to commit."
          fi
